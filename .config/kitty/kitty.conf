# Mirrors .config/ghostty/config so the two can be swapped via
# provisioning/terminal.yml (-e terminal=kitty|ghostty).

# Theme
include catppuccin-macchiato.conf

# Font
font_family DMMono Nerd Font
font_size   16

# Window
window_padding_width     14
confirm_os_window_close  0
hide_window_decorations  yes

# Transparency (text stays opaque; blur comes from Hyprland's decoration.blur).
# tmux and nvim use bg=default, so they show through too.
# Live-tweak: ctrl+shift+a then m (more) / l (less) / 1 (opaque) / d (reset to 0.6).
background_opacity         0.6
dynamic_background_opacity yes

# Cursor
cursor_shape          block
cursor_blink_interval 0
# Trail effect when the cursor jumps (stands in for ghostty's cursor shader)
cursor_trail          1

# Shell integration (no-cursor: keep the block cursor in every program)
shell_integration no-cursor

# macOS-specific, harmless on Linux
macos_option_as_alt yes

# Auto-launch tmux sessionizer on home directory
shell $HOME/.local/bin/tmux-home

# Keybinds
map shift+insert paste_from_clipboard
map ctrl+insert  copy_to_clipboard

# Send CSI u sequences for Ctrl+1-5 so they reach Neovim through tmux
map ctrl+1 send_text all \x1b[49;5u
map ctrl+2 send_text all \x1b[50;5u
map ctrl+3 send_text all \x1b[51;5u
map ctrl+4 send_text all \x1b[52;5u
map ctrl+5 send_text all \x1b[53;5u
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \x1b[13;2u
# Legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \x1b[13;4u
