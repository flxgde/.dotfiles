set -ga terminal-overrides ",screen-256color*:Tc"
set-option -g default-terminal "screen-256color"
set -s escape-time 0
set -g extended-keys on
set -as terminal-features 'screen-256color:extkeys'

set-option -g prefix C-b
bind-key C-b send-prefix

# Never fall out of tmux to a raw shell: closing the last pane of any
# session hands the client back to the home session instead. Closing the
# last pane of the home session itself just respawns a fresh shell there.
# See ~/.local/bin/tmux-pane-died for the branching logic.
set -g remain-on-exit on
set -g remain-on-exit-format ''
set -g detach-on-destroy off
set-hook -g pane-died 'run-shell -b "~/.local/bin/tmux-pane-died #{session_name} #{session_windows} #{window_panes} #{pane_id}"'

bind r source-file ~/.config/tmux/tmux.conf
set -g base-index 1
set -g history-limit 10000

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# vim-like pane switching
unbind o
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind-key -r f display-popup -E -w 75% -h 75% "~/.local/bin/tmux-sessionizer"
bind-key a display-popup -E -w 75% -h 75% "~/.local/bin/tmux-new-window"
bind-key -r Escape display-popup -E -w 75% -h 75% "~/.local/bin/tmux-switch-session"
bind-key BSpace display-popup -E -w 75% -h 75% '\
  old=$(tmux display-message -p "#S"); \
  ~/.local/bin/tmux-switch-session; \
  new=$(tmux display-message -p "#S"); \
  [ "$new" != "$old" ] && tmux kill-session -t "$old"'

# Kill the current session (lands on home instead of detaching)
bind-key X confirm-before -p "kill session #S? (y/n)" "run-shell -b \"~/.local/bin/tmux-kill-session #{session_name}\""



# Dedicated switches for the always-on home/dotfiles sessions (see
# tmux-sessionizer's cold-start bootstrap, which pins these to $0/$1).
# Excluded from the numbered switches below via tmux-numbered-sessions.
bind-key q run-shell "tmux has-session -t=flxg 2>/dev/null || tmux new-session -ds flxg -c \"$HOME\"; tmux switch-client -t flxg"
bind-key w run-shell "tmux has-session -t=_dotfiles 2>/dev/null || tmux new-session -ds _dotfiles -c \"$HOME/.dotfiles\"; tmux switch-client -t _dotfiles"

# Session switcher popup: q=home, w=dotfiles, 1-9=everything else,
# each a single keystroke (see tmux-session-picker).
bind-key s display-popup -E -w 60% -h 60% "~/.local/bin/tmux-session-picker"

# Jump back to the previously attached session
bind-key - switch-client -l

# Jump straight to the session most urgently needing attention:
# 🔔 notify > 💤 waiting > 🤖 busy (see tmux-goto-attention).
bind-key n run-shell "~/.local/bin/tmux-goto-attention"

# cheat.sh popup
bind-key -r i run-shell "tmux neww ~/.local/bin/tmux-cht.sh"

# lazygit popup
bind-key g display-popup -d "#{pane_current_path}" -w 90% -h 85% -E "lazygit"

# Catppuccin theme
# set -g @catppuccin_flavor "macchiato"

# Catppuccin window tab text (use #W = program name instead of #T = pane title)
# set -g @catppuccin_window_text " #{?window_zoomed_flag,🔍 ,}(#{window_panes}) #(tmux list-panes -t '#{window_id}' -F '##{?pane_active,[##{pane_current_command}],##{pane_current_command}}' | paste -sd '/')"
# set -g @catppuccin_window_current_text " #{?window_zoomed_flag,🔍 ,}(#{window_panes}) #(tmux list-panes -t '#{window_id}' -F '##{?pane_active,[##{pane_current_command}],##{pane_current_command}}' | paste -sd '/')"

# Catppuccin status bar configuration
# set -g status-left-length 120
# set -g status-left "#{E:@catppuccin_status_session} "
# set -g status-right-length 120
# set -g status-right "#{E:@catppuccin_status_date_time}"

# Status bar
set -g status-position top
set -g status-interval 5
# session-created/closed can fire with no client attached (e.g. `new-session -d`),
# so guard refresh-client to avoid "no current client" noise on startup.
set-hook -g client-session-changed 'refresh-client -S'
set-hook -g session-created 'run-shell -b "tmux refresh-client -S 2>/dev/null || true"'
set-hook -g session-closed 'run-shell -b "tmux refresh-client -S 2>/dev/null || true"'
set -g status-left-length 30
set -g status-right-length 200
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'


# Theme
set -g status 2
set -g status-format[1] "#[fg=blue,bg=default]#(python3 -c 'print(\"─\" * #{client_width}, end=\"\")')"
set -g status-style "bg=default,fg=default"
set -g status-left "#{?client_prefix,#[fg=blue#,bold]⌨️ PREFIX ,#{?pane_in_mode,#[fg=blue#,bold]COPY ,#{?window_zoomed_flag,#[fg=blue#,bold]ZOOM ,#[fg=brightblack]#h }}}"
set -g status-right "#(~/.local/bin/tmux-session-list)"
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue


# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"
