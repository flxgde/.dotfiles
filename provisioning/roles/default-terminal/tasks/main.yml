---
- name: Fail on unknown terminal
  ansible.builtin.assert:
    that: terminal in default_terminal_known
    fail_msg: >-
      terminal={{ terminal }} is not supported.
      Supported: {{ default_terminal_known.keys() | join(', ') }}.

- name: Ensure ~/.config/hypr exists
  become: false
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/hypr"
    state: directory
    mode: "0755"
  when: ansible_facts['system'] == "Linux"

# Not a symlink: generated per machine, loaded by .config/hypr/hyprland.lua
# after it sets its own TERMINAL default.
- name: Point Hyprland's TERMINAL at {{ terminal }}
  become: false
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/hypr/terminal.lua"
    content: |
      -- Generated by provisioning/terminal.yml — do not edit, re-run the playbook.
      TERMINAL = "{{ default_terminal_known[terminal].bin }}"
    mode: "0644"
  when: ansible_facts['system'] == "Linux"

- name: Set {{ terminal }} as default via xdg-terminals.list (alacritty fallback)
  become: false
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/xdg-terminals.list"
    content: |
      # Terminal emulator preference order for xdg-terminal-exec
      # The first found and valid terminal will be used
      {{ default_terminal_known[terminal].desktop }}
      Alacritty.desktop
    mode: "0644"
  when: ansible_facts['system'] == "Linux"

# Claude Code's default ("auto") picks its desktop-notification method from
# the detected terminal, but inside tmux it sees TERM_PROGRAM=tmux and sends
# nothing. Pinning the channel makes it emit the terminal's notification
# escape (wrapped for tmux; needs allow-passthrough in tmux.conf).
- name: Ensure ~/.claude directory exists
  become: false
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude"
    state: directory
    mode: "0755"

- name: Set Claude Code preferredNotifChannel to {{ default_terminal_known[terminal].claude_notif_channel }}
  become: false
  ansible.builtin.command:
    cmd: >-
      python3 {{ role_path }}/files/set_json_key.py
      {{ ansible_facts['env']['HOME'] }}/.claude/settings.json
      preferredNotifChannel
      '"{{ default_terminal_known[terminal].claude_notif_channel }}"'
  register: claude_notif_channel_set
  changed_when: "claude_notif_channel_set.stdout.strip() == 'changed'"
