---
- name: Check if neovim is already installed
  ansible.builtin.shell: command -v nvim
  register: nvim_which
  changed_when: false
  failed_when: false

- name: Install neovim (Arch)
  become: true
  community.general.pacman:
    name: neovim
    state: present
  when:
    - ansible_facts['os_family'] == "Archlinux"
    - nvim_which.rc != 0

- name: Install neovim via Homebrew (macOS)
  community.general.homebrew:
    name: neovim
    state: present
  when: ansible_facts['os_family'] == "Darwin"

# nvim-treesitter needs the tree-sitter CLI to build parsers
- name: Install tree-sitter CLI (Arch)
  become: true
  community.general.pacman:
    name: tree-sitter-cli
    state: present
  when: ansible_facts['os_family'] == "Archlinux"

- name: Install tree-sitter CLI via Homebrew (macOS)
  community.general.homebrew:
    name: tree-sitter-cli
    state: present
  when: ansible_facts['os_family'] == "Darwin"

# Mason installs most LSPs/formatters (html, cssls, pyright, prettier, ...) via npm
- name: Install Node.js and npm (Arch)
  become: true
  community.general.pacman:
    name:
      - nodejs
      - npm
    state: present
  when: ansible_facts['os_family'] == "Archlinux"

- name: Install Node.js via Homebrew (macOS)
  community.general.homebrew:
    name: node
    state: present
  when: ansible_facts['os_family'] == "Darwin"
