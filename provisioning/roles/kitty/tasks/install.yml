---
- name: Install kitty (Arch)
  become: true
  community.general.pacman:
    name: kitty
    state: present
  when: ansible_facts['os_family'] == "Archlinux"

- name: Install kitty via Homebrew (macOS)
  community.general.homebrew_cask:
    name: kitty
    state: present
  when: ansible_facts['os_family'] == "Darwin"
