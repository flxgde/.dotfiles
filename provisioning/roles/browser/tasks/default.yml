---
# macOS only lets the user change the default browser via a GUI prompt,
# so these are Linux-only.

- name: Ensure ~/.config/hypr exists
  become: false
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/hypr"
    state: directory
    mode: "0755"
  when: ansible_facts['system'] == "Linux"

# Not a symlink: generated per machine, loaded by .config/hypr/hyprland.lua
# after it sets its own BROWSER default.
- name: Point Hyprland's BROWSER at {{ browser }}
  become: false
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/hypr/browser.lua"
    content: |
      -- Generated by provisioning/browser.yml — do not edit, re-run the playbook.
      BROWSER = "{{ browser_known[browser].bin }}"
    mode: "0644"
  when: ansible_facts['system'] == "Linux"

- name: Read current xdg default browser
  become: false
  ansible.builtin.command: xdg-settings get default-web-browser
  register: browser_xdg_current
  changed_when: false
  check_mode: false
  failed_when: false
  when: ansible_facts['system'] == "Linux"

- name: Set {{ browser }} as xdg default browser (links, xdg-open)
  become: false
  ansible.builtin.command: xdg-settings set default-web-browser {{ browser_known[browser].desktop }}
  when:
    - ansible_facts['system'] == "Linux"
    - browser_xdg_current.stdout | default('') | trim != browser_known[browser].desktop
