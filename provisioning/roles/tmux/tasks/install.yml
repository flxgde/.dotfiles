---
- name: Install tmux
  become: "{{ ansible_facts['os_family'] != 'Darwin' }}"
  ansible.builtin.package:
    name: tmux
    state: present

- name: Install lazygit (Arch)
  become: true
  community.general.pacman:
    name: lazygit
    state: present
  when: ansible_facts['os_family'] == "Archlinux"

- name: Install lazygit via Homebrew (macOS)
  community.general.homebrew:
    name: lazygit
    state: present
  when: ansible_facts['os_family'] == "Darwin"

- name: Install yazi (Arch)
  become: true
  community.general.pacman:
    name: yazi
    state: present
  when: ansible_facts['os_family'] == "Archlinux"

- name: Install yazi via Homebrew (macOS)
  community.general.homebrew:
    name: yazi
    state: present
  when: ansible_facts['os_family'] == "Darwin"
